name: CI-CD

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  phase-1-testing:
    name: Phase 1 - Testing
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            backend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Install backend dependencies
        run: npm ci
        working-directory: backend

      - name: Run frontend lint
        run: npm run lint
        working-directory: frontend

      - name: Run backend lint
        run: npm run lint
        working-directory: backend

      - name: Prepare test reports directory
        run: mkdir -p test-reports

      - name: Frontend unit tests
        run: |
          node --test --test-reporter=junit --test-reporter-destination=../test-reports/frontend-unit.xml "src/**/*.test.js" || true
        working-directory: frontend

      - name: Backend unit tests
        run: |
          node --test --test-reporter=junit --test-reporter-destination=../test-reports/backend-unit.xml src/middleware/auth.test.js || true
        working-directory: backend
        env:
          JWT_SECRET: test-secret

      - name: Build frontend
        run: npm run build
        working-directory: frontend

      - name: Upload test reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-reports
          path: test-reports/
